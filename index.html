<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e46b5e" />
    <title>Trail Studio · 粒子与拖尾编辑器</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e46b5e'/%3E%3Cpath d='m16 5 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <header class="header">
      <a class="brand" href="./" aria-label="Trail Studio 首页"
        ><span class="brand-mark">✧</span
        ><span
          ><strong>Trail Studio</strong><small>粒子与拖尾编辑器</small></span
        ></a
      >
      <div class="project-title">
        <input
          id="project-name"
          aria-label="项目名称"
          maxlength="80"
          value="交换闪光"
        /><span id="save-status">未保存</span>
      </div>
      <nav class="actions" aria-label="项目操作">
        <button data-action="help" title="使用说明" aria-label="使用说明">
          <i data-icon="help"></i>
        </button>
        <button aria-label="项目" data-action="projects">
          <i data-icon="folder"></i><span>项目</span>
        </button>
        <button aria-label="版本" data-action="versions">
          <i data-icon="history"></i><span>版本</span>
        </button>
        <button aria-label="恢复默认" data-action="reset">
          <i data-icon="reset"></i><span>恢复默认</span>
        </button>
        <button aria-label="导入" data-action="import">
          <i data-icon="folder"></i><span>导入</span>
        </button>
        <button aria-label="保存" data-action="save">
          <i data-icon="save"></i><span>保存</span>
        </button>
        <div class="export-wrap">
          <button
            class="primary"
            data-action="export-menu"
            aria-expanded="false"
          >
            <i data-icon="download"></i>导出<i data-icon="chevron"></i>
          </button>
          <div id="export-menu" class="dropdown" hidden>
            <button data-action="export-project">
              <i data-icon="file"></i
              ><span
                >完整项目文件<small>包含纹理、轨迹与预览设置</small></span
              ></button
            ><button data-action="export-runtime">
              <i data-icon="code"></i
              ><span
                >效果参数 JSON<small>粒子、拖尾和轨迹配置</small></span
              ></button
            ><button data-action="screenshot">
              <i data-icon="image"></i
              ><span>预览截图 PNG<small>保存当前画布</small></span>
            </button>
          </div>
        </div>
      </nav>
    </header>
    <main class="workspace">
      <aside class="presets">
        <div class="panel-heading">
          <strong>场景预设</strong><span>5 ITEMS</span>
        </div>
        <div id="preset-list"></div>
        <footer>HAPPY TRAIL <b>V2</b> PX · S · DEG</footer>
      </aside>
      <section class="preview" aria-label="实时预览">
        <div class="toolbar">
          <div class="playback">
            <button
              data-action="pause"
              aria-label="暂停预览"
              title="暂停 / 播放 · 空格"
            >
              <i data-icon="pause"></i></button
            ><button
              data-action="restart"
              aria-label="从头播放"
              title="从头播放"
            >
              <i data-icon="reset"></i>
            </button>
          </div>
          <div class="segments modes" aria-label="预览路径模式">
            <button data-mode="auto" class="selected">
              <i data-icon="path"></i>自动路径</button
            ><button data-mode="draw">
              <i data-icon="pointer"></i>手绘路径</button
            ><button data-mode="edit"><i data-icon="nodes"></i>轨迹编辑</button>
          </div>
          <div class="view-controls">
            <select id="background" aria-label="预览背景">
              <option value="board">棋盘背景</option>
              <option value="dark">深色网格</option>
              <option value="light">浅色网格</option></select
            ><label for="zoom">缩放</label
            ><input
              id="zoom"
              type="range"
              min="0.25"
              max="2"
              step="0.05"
              value="1"
            /><output id="zoom-value">100%</output>
          </div>
        </div>
        <div class="stage">
          <canvas
            id="preview"
            aria-label="粒子拖尾实时预览画布"
            tabindex="0"
          ></canvas>
          <div id="stage-hint" class="stage-hint" hidden></div>
          <div class="stats">
            <span class="live-dot"></span><span id="live-label">LIVE</span
            ><span><b id="particle-count">0</b> 粒子</span
            ><span><b id="trail-count">0</b> 拖尾点</span
            ><span><b id="fps">60</b> FPS</span>
          </div>
          <span class="scale-label">1 格 = 48 px</span>
        </div>
      </section>
      <aside class="inspector">
        <nav id="tabs" aria-label="参数分类"></nav>
        <div id="parameters"></div>
      </aside>
    </main>
    <input
      id="import-file"
      type="file"
      accept=".json,application/json"
      hidden
    />
    <input
      id="texture-file"
      type="file"
      accept="image/png,image/jpeg,image/webp"
      hidden
    />
    <dialog id="dialog">
      <div class="dialog-header">
        <h2 id="dialog-title"></h2>
        <button data-action="close-dialog" aria-label="关闭">×</button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
